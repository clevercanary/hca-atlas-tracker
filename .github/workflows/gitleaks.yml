name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so a secret committed and then removed still fails the scan.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # The gitleaks v8.30.1 image, pinned by digest. Bump the tag and digest together.
        uses: docker://zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          # The runner sets HOME=/github/home, so git never reads the image's safe.directory setting in /root/.gitconfig.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --no-banner --redact .
