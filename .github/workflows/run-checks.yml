name: Run checks
on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: |
          npm ci
          npm run check-format
          npm run lint
          npm run typecheck
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the Postgres major version used for development (see schema.sql)
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas-tracker-test
          # Run Postgres and Node in different non-UTC time zones, so that tests catch code that depends on either
          # being UTC or on the two agreeing (see #1464 and #1558). initdb sets the server's default time zone from TZ.
          TZ: America/Los_Angeles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover compares against the base branch, so it needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Off: a shared CI cache can let one run tamper with a later one, and
          # it saves about a second here.
          enable-cache: false
          version: "0.13.7"
      - run: npm ci
      - name: Check Postgres time zone
        run: test "$(psql -h localhost -d atlas-tracker-test -Atc 'SHOW timezone')" = "America/Los_Angeles"
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
      - name: Unit tests with coverage
        run: npm run test:coverage
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          TZ: Australia/Sydney
      - name: Coverage totals
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.txt') != '' }}
        # Fenced: text-summary's "=====" lines would otherwise render as a heading.
        run: |
          cat coverage/coverage-summary.txt
          {
            echo "### Unit test coverage"
            echo '```'
            cat coverage/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Changed-line coverage
        run: npm run test:diff-coverage -- --format "markdown:$GITHUB_STEP_SUMMARY"
        env:
          BASE: ${{ github.base_ref }}
