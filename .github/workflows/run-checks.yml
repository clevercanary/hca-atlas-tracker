name: Run checks
on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: |
          npm ci
          npm run check-format
          npm run lint
          npm run typecheck
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the Postgres major version used for development (see schema.sql)
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas-tracker-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # diff-cover compares against the base branch, so it needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Off: uv fetches the locked diff-cover each run, which takes about a
          # second, and nothing is restored from a shared cache.
          enable-cache: false
          version: "0.13.7"
      - run: npm ci
      - name: Unit tests with coverage
        run: npm run test:coverage
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          TZ: UTC
      - name: Changed-line coverage
        # Runs whenever test-coverage.sh kept the XML, which it does only when
        # no test suite failed, even if the previous step failed for another
        # reason.
        if: ${{ !cancelled() && hashFiles('coverage/cobertura-coverage.xml') != '' }}
        run: npm run test:diff-coverage
        env:
          BASE: ${{ github.base_ref }}
