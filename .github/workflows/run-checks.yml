name: Run checks
on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: |
          npm ci
          npm run check-format
          npm run lint
          npm run typecheck
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the Postgres major version used for development (see schema.sql)
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas-tracker-test
          # Run Postgres and Node in different non-UTC time zones, so that tests catch code that depends on either
          # being UTC or on the two agreeing (see #1464 and #1558). initdb sets the server's default time zone from TZ.
          TZ: America/Los_Angeles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Check Postgres time zone
        run: test "$(psql -h localhost -d atlas-tracker-test -Atc 'SHOW timezone')" = "America/Los_Angeles"
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
      - run: npm test
        env:
          PGPASSWORD: postgres
          PGUSER: postgres
          TZ: Australia/Sydney
